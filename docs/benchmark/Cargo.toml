[package]
name = "srv"
version = "0.1.0"
edition = "2021"
[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
futures-util = "0.3"
[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
