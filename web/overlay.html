<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#fff}
#root{position:absolute;inset:0}
#debug{position:absolute;left:0;top:0;font-size:14px;background:rgba(0,0,0,.5);padding:.4rem .6rem}
</style>
</head>
<body>
<div id="root"></div>
<div id="debug" hidden></div>
<script type="module">
// Lädt pro Modul-Typ /overlays/<typ>.js (exportiert render(root, modul) und optional onEvent(ereignis)).
// Keine Timer im Leerlauf; WebSocket-Reconnect mit wachsendem Abstand.
const id = location.pathname.split("/").pop();
const debug = new URLSearchParams(location.search).has("debug");
const box = document.getElementById("debug");
function note(text) { if (debug) { box.hidden = false; box.textContent = text; } }

async function init() {
  const mod = await (await fetch(`/api/overlay/${id}`)).json();
  if (!mod.enabled) return;
  let view = {};
  if (/^[a-z_]+$/.test(mod.type)) {
    try { view = await import(`/overlays/${mod.type}.js`); } catch { note(`${mod.name}: Overlay für «${mod.type}» ist noch nicht umgesetzt`); }
  }
  view.render?.(document.getElementById("root"), mod);
  connect(view);
}
let delay = 1000;
function connect(view) {
  const ws = new WebSocket(`ws://${location.host}/ws/overlay/${id}`);
  ws.onopen = () => { delay = 1000; };
  ws.onmessage = e => view.onEvent?.(JSON.parse(e.data));
  ws.onclose = () => { setTimeout(() => connect(view), delay); delay = Math.min(delay * 2, 30000); };
}
init().catch(e => note("Fehler: " + e.message));
</script>
</body>
</html>
